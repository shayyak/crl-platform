# CRL serving layer: Nginx caching proxy in front of one site's S3 (docs/adr/0008-nginx-public-bucket.md).
# Three placeholders below (host, tenant and bucket of S3) are filled in by Helm from values.yaml
# (s3.host, s3.tenant, s3.bucket); do not edit them here.
#
# Behaviour
# - Serves only GET/HEAD of *.crl, *.crt and *.xml over HTTP (all public). Everything else: 404 (405 for other methods).
# - A cached copy is fresh for 1 minute, then revalidated against S3 (304 = keep it); clients get the cached
#   copy immediately while the check runs in the background.
# - If S3 fails (connection, timeout, 5xx, 403, 404), the last copy keeps being served, marked
#   X-Cache-Status: STALE. The monitor alerts on STALE (check stale_cache) and on expired CRLs.
# - Runs as non-root on port 8080; writable paths are /tmp and /var/cache/nginx only.

# Fixed, not auto: in a container auto counts every core of the node (e.g. 32 workers) and can exceed the
# memory limit. Two workers are far more than CRL traffic needs.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    log_format crl escape=json '{"time":"$time_iso8601","client":"$remote_addr","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"cache":"$upstream_cache_status",'
        '"s3Status":"$upstream_status","s3Ms":"$upstream_response_time","ms":$request_time}';
    access_log /dev/stdout crl;

    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;

    # Cache on the pod's own volume (1Gi emptyDir): max_size stays well below it, so the volume never
    # overflows (an overflow evicts the pod). inactive=7d: a copy unused for 7 days is dropped.
    proxy_cache_path /var/cache/nginx/crl levels=1:2 keys_zone=crl:10m max_size=512m inactive=7d use_temp_path=off;

    # The path exactly as the client sent it (still URL-encoded, e.g. spaces as %20), without a query string.
    map $request_uri $crl_path {
        "~^(?<p>/[^?]*)" $p;
        default          "";
    }
    # S3 may read a literal "+" in a path as a space; send it as %2B (delta CRLs: "<name>+.crl").
    map $crl_path $s3_path {
        "~^(?<a>[^+]*)\+(?<b>[^+]*)$" "${a}%2B${b}";
        default                       $crl_path;
    }

    # Content-Type by file extension (public files: CRL, CA certificate for AIA, XML).
    map $crl_path $ctype {
        "~\.crl$"    "application/pkix-crl";
        "~\.crt$"    "application/pkix-cert";
        "~\.xml$"    "application/xml";
        default      "application/octet-stream";
    }

    upstream s3 {
        server S3_HOST:443;
        keepalive 8;
    }

    server {
        listen 8080 default_server;
        server_name _;

        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        # No dot-segments, encoded dots or slashes, backslashes, double slashes: keys are taken literally.
        if ($request_uri ~* "(\.\.|%2e|%2f|%5c|\x5c|//)") { return 404; }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # A CRL, CA certificate (.crt) or XML: letters, digits, space, ( ) . _ - ~ and at most one "+".
        location ~ "^/[A-Za-z0-9 ()._~/-]+\+?[A-Za-z0-9 ()._~-]*\.(crl|crt|xml)$" {
            proxy_pass https://s3/S3_TENANT:S3_BUCKET$s3_path;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host S3_HOST;
            proxy_ssl_server_name on;
            proxy_ssl_name S3_HOST;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 4;
            proxy_ssl_trusted_certificate /etc/nginx/s3-ca/ca.pem;

            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            proxy_next_upstream off;

            proxy_cache crl;
            proxy_cache_key $crl_path;
            proxy_cache_valid 200 1m;
            proxy_cache_valid 404 10s;
            proxy_cache_revalidate on;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504 http_403 http_404;
            # Our freshness rules, not whatever S3 sends.
            proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;

            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Set-Cookie;
            proxy_hide_header Content-Type;
            add_header Content-Type $ctype always;
            proxy_hide_header Server;
            proxy_hide_header x-amz-request-id;
            proxy_hide_header x-amz-id-2;
            proxy_hide_header x-rgw-object-type;
            # The bucket is public: do not tell every client the CA's host name.
            proxy_hide_header x-amz-meta-source-host;
            # The other x-amz-meta-* stay: the monitor reports them (run-id, crl-number-hex, sha256).

            add_header Cache-Control "public, max-age=60" always;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        location / {
            return 404;
        }
    }
}
